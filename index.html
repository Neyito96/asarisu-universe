<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朝リスの宇宙｜探索ラボ V0.8.6</title>
<style>:root{color-scheme:dark}body{margin:0;background:#080e20;color:#e8efff;font:15px/1.6 system-ui,sans-serif}header,main{padding:22px max(20px,4vw)}h1{margin:0;font-size:clamp(28px,5vw,50px)}p{color:#a8b8d7}button{background:#1e3155;color:#fff;border:1px solid #4b6898;border-radius:8px;padding:8px 12px;cursor:pointer;margin-right:8px}button[aria-pressed=true]{background:#3763a4}#space{background:radial-gradient(ellipse at center,#162b51 0%,#0a132b 65%,#060b19 100%);border:1px solid #26395c;border-radius:18px;width:100%;height:65vh;min-height:420px;display:block;touch-action:none}#status{min-height:25px}#results{max-height:240px;overflow:auto}a{color:#9cdcff}li{margin-bottom:7px}#resultTitle{scroll-margin-top:16px}#nested{margin:16px 0;padding:14px;border:1px solid #35527d;border-radius:14px;background:#101d38}#nestedStars{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}#nestedStars button{border-radius:999px;margin:0;background:#24436d}#nestedStars button small{display:block;color:#d1e1ff}#legend{color:#a8b8d7;font-size:13px}#loadTrack{height:5px;background:#1c3154;border-radius:99px;overflow:hidden;max-width:460px;margin-top:8px}#loadFill{height:100%;width:0%;background:linear-gradient(90deg,#5b8bea,#a4dfff);transition:width .2s ease}#loadTrack[hidden]{display:none}</style></head><body>
<header><h1>朝リスの宇宙 <small>V0.8.6 LAB</small></h1><p>意味のある話題からエピソードを探す、実データ探索の試作</p><nav><button data-mode="words" aria-pressed="true">話題の星雲</button><button data-mode="people" aria-pressed="false">出演者の星座</button><button data-mode="roles" aria-pressed="false">肩書の星座</button><button data-mode="episodes" aria-pressed="false">関連エピソード宇宙</button></nav><p id="status">公開図書館を読み込み中…</p><div id="loadTrack" role="progressbar" aria-label="図書館データの取得進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loadFill"></div></div></header>
<main><canvas id="space"></canvas><p id="legend">星の面積は関連エピソード件数に比例（話題・出演者・肩書モード、上限なし）。肩書の星座は出演者欄に肩書が記録された回だけを集計し、肩書の記載がない回は含みません。エピソード宇宙ではタイトルの話題分類ごとに星が集まります（最大1,800件）。星の上に関連件数を表示。指一本で移動、二本指でピンチ拡大・縮小、タップで星を選択。PCではドラッグ・ホイール操作。</p><section id="nested" hidden><h2 id="nestedTitle">星の内側</h2><p id="nestedHint"></p><button id="nestedBack" type="button">星の内側を閉じる</button><div id="nestedStars" role="group" aria-label="内側の星"></div></section><h2 id="resultTitle">選択した星</h2><ol id="results"></ol></main>
<script type="module">
const base="https://neyito96.github.io/asarisunowa/library/data/";
const canvas=document.querySelector("#space"),ctx=canvas.getContext("2d"),$=s=>document.querySelector(s);
const excluded=new Set(["アルキキ","AJW","朝ポキTV"]);
let rows=[],stars=[],mode="words",scale=1,ox=0,oy=0;const pointers=new Map();let gesture=null,selectedStar=null,episodeClusters=[];
const hash=s=>{let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0};
const rnd=(s,n)=>((hash(s+":"+n)%100000)/100000);
const json=async path=>{const r=await fetch(base+path,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.json()};
const topicRules=[["政治","政治|国会|首相|内閣|政党|議員|選挙|政権|大臣|官邸"],["経済","経済|景気|物価|円安|円高|賃金|株価|金融|投資|税金|企業|日銀"],["福祉","福祉|介護|障害|生活保護|社会保障|年金|ケア|支援員"],["教育","教育|学校|大学|高校|中学|小学校|教員|教師|受験|授業|不登校"],["医療","医療|病院|医師|患者|治療|診療|薬剤|感染症|ワクチン"],["AI・技術","AI|人工知能|生成AI|ChatGPT|半導体|ロボット|アルゴリズム"],["国際","外交|国際|国連|戦争|紛争|ウクライナ|ロシア|中国|米国|アメリカ|中東"],["環境・気候","気候|環境|温暖化|脱炭素|再生可能|太陽光|森林|豪雨|災害"],["文化・芸術","文化|芸術|美術|映画|演劇|文学|小説|音楽|漫画|アニメ"],["スポーツ","スポーツ|野球|サッカー|五輪|オリンピック|バレー|陸上|スキー"],["暮らし","暮らし|生活費|家計|住宅|子育て|育児|家族|食卓|食料"],["地方・地域","地方|地域|自治体|市町村|過疎|移住|農村|農業|地方創生"],["人権・司法","人権|裁判|司法|差別|憲法|法律|逮捕|事件|犯罪"],["メディア","報道|新聞|記者|メディア|SNS|フェイクニュース|情報公開"],["科学","科学|研究|宇宙|天文学|生物|地震|考古|発見"],["労働","労働|働き方|雇用|就職|転職|人手不足|賃上げ|労災"],["ジェンダー","ジェンダー|男女|女性|男性|性別|LGBT|同性婚"],["歴史","歴史|戦後|昭和|明治|大正|古代|史料|遺跡"],["交通","交通|鉄道|新幹線|自動車|道路|航空|飛行機"],["動物・自然","動物|野生|生態|鳥類|昆虫|ペット|クマ|熊"]];
function wordsOf(title){const t=String(title||"").normalize("NFKC");return topicRules.filter(([label,pattern])=>new RegExp(pattern,"i").test(t)).map(([label])=>label)}
const roleNames=new Set(["音声ディレクター","編集委員","政治部デスク","社会部デスク","経済部デスク","文化部デスク","編集委員会","朝日新聞デジタル編集長","withnews編集長","withnews・前編集長","ネットワーク報道本部","社会部","大阪社会部","政治部","経済部","文化部","編集長","副編集長","デスク","プロデューサー","ディレクター","音声プロデューサー","音声編集","記者","編集者","司会","アナウンサー"]);
function castTokens(cast){return String(cast||"").split(/[、,，;；\n\/／]/).map(s=>s.replace(/\([^)]*\)|（[^）]*）/g,"").trim()).filter(s=>s.length>=2&&s.length<=24&&!/(?:https?|www\.|twitter|ツイッター|Ｘ(?:旧ツイッター)?|x\.com|\.com\b|\.jp\b|\.net\b|\.org\b|URL|ＵＲＬ|@[a-z0-9_]{1,15}\b|(?:^|\s)(?:X|𝕏)[:：＠@]|(?:^|\s)(?:SNS|アカウント|公式アカウント)(?:$|[:：]))/i.test(s)&&!/^[@＠][a-z0-9_]{1,15}$/i.test(s))}
function isRole(s){return roleNames.has(s)||/^(?:.+部(?:デスク|編集長)|.+編集部(?:長)?|.+報道本部|.+編集委員|.+ディレクター|.+プロデューサー)$/.test(s)}
function peopleOf(cast){return castTokens(cast).filter(s=>!isRole(s)).slice(0,12)}
function rolesOf(cast){return castTokens(cast).filter(isRole).slice(0,12)}
function radiusFor(count){return Math.sqrt(count/Math.PI)*12}
function layoutStars(items){
 const n=items.length, golden=Math.PI*(3-Math.sqrt(5));
 // Spiral packing: retain a consistent location per label while preventing overlaps.
 const placed=[];
 for(const item of items){
  const phase=rnd(item.label,7)*Math.PI*2;
  let found=false;
  for(let k=0;k<18000;k++){
   const angle=k*golden+phase;
   const distance=14*Math.sqrt(k);
   const x=Math.cos(angle)*distance,y=Math.sin(angle)*distance*.72;
   if(placed.every(p=>Math.hypot(x-p.x,y-p.y)>item.r+p.r+26)){
    item.x=x;item.y=y;placed.push(item);found=true;break;
   }
  }
  if(!found){let x=0,y=0,step=0;do{step++;const a=step*golden;const d=22*Math.sqrt(step);x=Math.cos(a)*d;y=Math.sin(a)*d*.72}while(placed.some(p=>Math.hypot(x-p.x,y-p.y)<=item.r+p.r+26));item.x=x;item.y=y;placed.push(item)}
 }
 return items;
}
function fitStars(){
 if(!stars.length)return;
 const left=Math.min(...stars.map(s=>s.x-s.r-22)),right=Math.max(...stars.map(s=>s.x+s.r+22));
 const top=Math.min(...stars.map(s=>s.y-s.r-35)),bottom=Math.max(...stars.map(s=>s.y+s.r+22));
 const w=canvas.clientWidth,h=canvas.clientHeight;
 scale=Math.min(1.35,Math.min(w/(right-left),h/(bottom-top))*.90);
 ox=-(left+right)/2*scale;oy=-(top+bottom)/2*scale;
}
function makeStars(){
 if(mode==="episodes"){
  const sample=rows.length<=1800?rows:rows.filter((r,i)=>Math.floor((i+1)*1800/rows.length)>Math.floor(i*1800/rows.length));
  const groups=new Map();
  for(const r of sample){const topics=wordsOf(r.title);const primary=topics[0]||"未分類";if(!groups.has(primary))groups.set(primary,[]);groups.get(primary).push({r,topics})}
  const labels=[...topicRules.map(x=>x[0]),"未分類"];
  stars=[];episodeClusters=[];
  for(let j=0;j<labels.length;j++){
    const label=labels[j],members=groups.get(label)||[];if(!members.length)continue;
    const col=j%5,row=Math.floor(j/5),cx=(col-2)*860,cy=(row-2)*850;
    episodeClusters.push({label,count:members.length,x:cx,y:cy});
    members.forEach(({r,topics},i)=>{
      const angle=i*2.399963229728653+rnd(r.id,4)*.16;
      const distance=12*Math.sqrt(i);
      const secondary=topics[1],shift=secondary?((hash(secondary)%9)-4)*4:0;
      stars.push({label:r.id,count:1,episodes:[r],x:cx+Math.cos(angle)*distance+shift,y:cy+Math.sin(angle)*distance+shift,r:4,kind:r.show,topic:label})
    })
  }
  return
 }
 const groups=new Map();
 for(const r of rows){const tokens=mode==="words"?wordsOf(r.title):mode==="roles"?rolesOf(r.cast):peopleOf(r.cast);for(const key of new Set(tokens)){if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}}
 const max=mode==="words"?20:mode==="roles"?100:150;
 stars=[...groups].filter(([k,v])=>v.length>=(mode==="words"?1:2)).sort((a,b)=>b[1].length-a[1].length).slice(0,max).map(([label,episodes],i)=>({label,count:episodes.length,episodes,x:(rnd(label,1)-.5)*1150,y:(rnd(label,2)-.5)*750,r:radiusFor(episodes.length)}));
 layoutStars(stars);
}
function resize(){const d=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=Math.floor(rect.width*d);canvas.height=Math.floor(rect.height*d);ctx.setTransform(d,0,0,d,0,0);fitStars();draw()}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2+ox,h/2+oy);ctx.scale(scale,scale);
 if(mode==="episodes"){for(const c of episodeClusters){ctx.textAlign="center";ctx.font="bold 36px system-ui";ctx.fillStyle="#e8efff";ctx.fillText(c.label,c.x,c.y-325);ctx.font="22px system-ui";ctx.fillStyle="#a8b8d7";ctx.fillText(c.count+"件",c.x,c.y-290)}}
 for(const s of stars){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);const hue=190+(hash(mode==="episodes"?s.topic:s.label)%105);ctx.fillStyle=`hsla(${hue},85%,72%,.85)`;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;if(s===selectedStar){ctx.beginPath();ctx.arc(s.x,s.y,s.r+6/scale,0,Math.PI*2);ctx.strokeStyle="#fff";ctx.lineWidth=2.5/scale;ctx.stroke()}
 }
 ctx.restore();
 if(mode!=="episodes"){
  const occupied=[];
  const sorted=[...stars].sort((a,b)=>(b===selectedStar)-(a===selectedStar)||b.count-a.count);
  for(const s of sorted){
   if(!s.count)continue;
   const x=w/2+ox+s.x*scale,y=h/2+oy+(s.y-s.r)*scale-9;
   if(x<0||x>w||y<25||y>h-12)continue;
   const labelSize=Math.max(16,Math.min(25,16+Math.log2(Math.max(1,scale))*3));ctx.font="700 "+labelSize+"px system-ui";const tw=ctx.measureText(s.label).width;
   const left=x-tw/2-5,right=x+tw/2+5,top=y-labelSize-4,bottom=y+22;
   if(s!==selectedStar&&occupied.some(r=>left<r.right&&right>r.left&&top<r.bottom&&bottom>r.top))continue;
   occupied.push({left,right,top,bottom});
   ctx.textAlign="center";ctx.lineJoin="round";ctx.strokeStyle="#081126";ctx.lineWidth=4;
   ctx.strokeText(s.label,x,y);ctx.fillStyle="#f4f8ff";ctx.fillText(s.label,x,y);
   ctx.font="600 "+Math.max(12,Math.min(17,labelSize-4))+"px system-ui";ctx.strokeText(s.count.toLocaleString()+"件",x,y+17);
   ctx.fillStyle="#d3e4ff";ctx.fillText(s.count.toLocaleString()+"件",x,y+17);
  }
 }
}
function openNested(s){
 const panel=$("#nested"),holder=$("#nestedStars");holder.replaceChildren();
 if(mode==="episodes"||mode==="roles"){panel.hidden=true;return}
 const groups=new Map();
 for(const e of s.episodes){
  const tokens=mode==="words"?peopleOf(e.cast):wordsOf(e.title);
  for(const name of new Set(tokens)){if(!groups.has(name))groups.set(name,[]);groups.get(name).push(e)}
 }
 const children=[...groups].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],"ja")).slice(0,32);
 panel.hidden=false;$("#nestedTitle").textContent=s.label+" の内側";
 $("#nestedHint").textContent=mode==="words"?"この話題を語った出演者（最大32人）。選ぶと該当回を表示します。":"この出演者が語ったテーマ（最大20種類）。選ぶと該当回を表示します。";
 if(!children.length){holder.textContent="関連する星はまだありません。";return}
 for(const [name,episodes] of children){
  const b=document.createElement("button");b.type="button";b.textContent=name+" ";
  const count=document.createElement("small");count.textContent=episodes.length.toLocaleString()+"件";b.append(count);
  b.style.fontSize=Math.min(19,12+Math.sqrt(episodes.length))+"px";
  b.addEventListener("click",()=>{showEpisodes(name,episodes);$("#resultTitle").scrollIntoView({behavior:"smooth",block:"start"})});
  holder.append(b)
 }
}
function showEpisodes(label,episodes){
 $("#resultTitle").textContent=label+"｜関連 "+episodes.length+"件";
 const ol=$("#results");ol.replaceChildren(...episodes.slice(0,80).map(e=>{const li=document.createElement("li"),a=document.createElement("a");a.href="https://neyito96.github.io/asarisunowa/library/?ep="+encodeURIComponent(e.id);a.target="_blank";a.rel="noopener noreferrer";a.textContent=e.title+"（"+e.show+"）";li.append(a);return li}))
}
$("#nestedBack").addEventListener("click",()=>{$("#nested").hidden=true;$("#nestedStars").replaceChildren()});
function selectStar(s){selectedStar=s;draw();openNested(s);$("#resultTitle").textContent=mode==="episodes"?`${s.topic}｜${s.episodes[0].title}`:`${s.label}｜関連 ${s.episodes.length}件`;const ol=$("#results");ol.replaceChildren(...s.episodes.slice(0,80).map(e=>{const li=document.createElement("li"),a=document.createElement("a");a.href="https://neyito96.github.io/asarisunowa/library/?ep="+encodeURIComponent(e.id);a.target="_blank";a.rel="noopener noreferrer";a.textContent=e.title+"（"+e.show+"）";li.append(a);return li}));$("#resultTitle").scrollIntoView({behavior:"smooth",block:"start"})}
function localPoint(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function hitTest(p){const x=(p.x-canvas.clientWidth/2-ox)/scale,y=(p.y-canvas.clientHeight/2-oy)/scale;let best=null,dist=Infinity;for(const s of stars){const d=Math.hypot(s.x-x,s.y-y);if(d<dist){best=s;dist=d}}return best&&dist<Math.max(18/scale,best.r+8/scale)?best:null}
function zoomAt(factor,p){const old=scale,next=Math.max(.18,Math.min(8,old*factor));const cx=canvas.clientWidth/2,cy=canvas.clientHeight/2;ox=p.x-cx-(p.x-cx-ox)*(next/old);oy=p.y-cy-(p.y-cy-oy)*(next/old);scale=next}
function beginGesture(){const ps=[...pointers.values()];if(ps.length===1){gesture={kind:"pan",point:{...ps[0]},start:{...ps[0]},moved:false}}else if(ps.length>=2){const a=ps[0],b=ps[1];gesture={kind:"pinch",distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),center:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}}
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;e.preventDefault();pointers.set(e.pointerId,localPoint(e));canvas.setPointerCapture(e.pointerId);beginGesture()});
canvas.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,localPoint(e));const ps=[...pointers.values()];if(ps.length>=2){const a=ps[0],b=ps[1],center={x:(a.x+b.x)/2,y:(a.y+b.y)/2},distance=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));if(!gesture||gesture.kind!=="pinch"){beginGesture();return}ox+=center.x-gesture.center.x;oy+=center.y-gesture.center.y;zoomAt(distance/gesture.distance,center);gesture={kind:"pinch",distance,center};draw()}else if(ps.length===1&&gesture?.kind==="pan"){const p=ps[0];ox+=p.x-gesture.point.x;oy+=p.y-gesture.point.y;if(Math.hypot(p.x-gesture.start.x,p.y-gesture.start.y)>8)gesture.moved=true;gesture.point={...p};draw()}});
function endPointer(e){if(!pointers.has(e.pointerId))return;const p=localPoint(e),tap=pointers.size===1&&gesture?.kind==="pan"&&!gesture.moved&&Math.hypot(p.x-gesture.start.x,p.y-gesture.start.y)<10;pointers.delete(e.pointerId);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(tap){const star=hitTest(p);if(star)selectStar(star)}beginGesture()}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);beginGesture()});
canvas.addEventListener("lostpointercapture",e=>{if(pointers.delete(e.pointerId))beginGesture()});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,localPoint(e));draw()},{passive:false});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));makeStars();selectedStar=null;$("#nested").hidden=true;$("#nestedStars").replaceChildren();fitStars();draw();$("#resultTitle").textContent="選択した星";$("#results").replaceChildren();$("#status").textContent=`${rows.length.toLocaleString()}件から ${stars.length}個の星を表示（話題はタイトルのキーワード一致・複数分類あり）`}));
async function init(){try{const m=await json("manifest.json");const files=m.shows.filter(s=>!excluded.has(s.name)).flatMap(s=>s.search||[]);const all=[];for(let i=0;i<files.length;i+=8){const pages=await Promise.all(files.slice(i,i+8).map(json));pages.forEach(p=>all.push(...p));{const done=Math.min(i+8,files.length),pct=Math.round(done/files.length*100);$("#status").textContent=`宇宙を準備しています… ${pct}%（${done}/${files.length}ファイル）`;$("#loadFill").style.width=pct+"%";$("#loadTrack").setAttribute("aria-valuenow",String(pct))}}const seen=new Set();rows=all.filter(r=>{if(!/^EP-\d{5}$/.test(r.id)||seen.has(r.id)||/(再配信|再放送|アンコール)/.test(r.title||""))return false;seen.add(r.id);return true});makeStars();$("#loadTrack").hidden=true;$("#status").textContent=`公開図書館 ${m.version}｜${rows.length.toLocaleString()}エピソードを読み込みました｜${stars.length}個の星を表示`;resize()}catch(e){$("#loadTrack").hidden=true;$("#status").textContent="読み込み失敗: "+e.message;console.error(e)}}
window.addEventListener("resize",resize);init();
</script></body></html>
