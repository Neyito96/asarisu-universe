const $=s=>document.querySelector(s),wait=()=>new Promise(r=>setTimeout(r,0));let rows=[],scope="world",map=null,layer=null,placeGroups=new Map();
function showEpisodes(name,list){$("#detail").hidden=false;$("#episodeTitle").textContent=name+"｜関連 "+list.length+"件（先頭80件）";const ol=$("#results");ol.replaceChildren();for(const r of list.slice(0,80)){const li=document.createElement("li"),a=document.createElement("a");a.href="https://neyito96.github.io/asarisunowa/library/?ep="+encodeURIComponent(r.id);a.target="_blank";a.rel="noopener noreferrer";a.textContent=(r.title||r.id)+"（"+(r.show||"")+"）";li.append(a);ol.append(li)}$("#detail").scrollIntoView({behavior:"smooth",block:"start"})}
function draw(){if(!map)return;layer.clearLayers();let count=0;for(const p of PLACES){if(p[3]!==scope)continue;const list=placeGroups.get(p[0])||[];if(!list.length)continue;count++;const circle=L.circleMarker([p[1],p[2]],{radius:Math.min(24,5+Math.sqrt(list.length)*1.8),color:"#a3e7ef",fillColor:"#4c9db6",fillOpacity:.75,weight:1.5}).addTo(layer);circle.bindTooltip(p[0]+"｜"+list.length+"件");const button=document.createElement("button");button.textContent=p[0]+"｜"+list.length+"件を見る";button.onclick=()=>showEpisodes(p[0],list);const div=document.createElement("div");div.append(button);circle.bindPopup(div)}$("#geoSummary").textContent=(scope==="world"?"世界":"日本")+"｜"+count+"地点を表示。丸印をタップしてエピソードを探索";map.setView(scope==="world"?[19,20]:[36.5,137.8],scope==="world"?2:5);setTimeout(()=>map.invalidateSize(),100)}
async function loadMap(){const link=document.createElement("link");link.rel="stylesheet";link.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.append(link);await new Promise((resolve,reject)=>{const sc=document.createElement("script");sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";sc.onload=resolve;sc.onerror=reject;document.head.append(sc)});map=L.map("map",{worldCopyJump:true}).setView([19,20],2);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:12,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);layer=L.layerGroup().addTo(map)}
async function load(){try{await loadMap();$("#status").textContent="地図表示完了｜エピソードを取得しています…";const res=await fetch(BASE+"manifest.json");if(!res.ok)throw Error("manifest HTTP "+res.status);const manifest=await res.json();const files=manifest.shows.flatMap(x=>x.search||[]);const all=[];for(let i=0;i<files.length;i++){const r=await fetch(BASE+files[i]);if(!r.ok)throw Error("data HTTP "+r.status);all.push(...await r.json());$("#status").textContent="データ読み込み中 "+(i+1)+"/"+files.length;$("#bar").style.width=(100*(i+1)/files.length)+"%";await wait()}const sr=await fetch(BASE+"scope.json");if(!sr.ok)throw Error("掲載判定取得失敗");const publication=await import(BASE+"../publication-scope.mjs");rows=publication.selectPublishedEpisodes(all,await sr.json(),{requireComplete:true});$("#status").textContent="掲載対象 "+rows.length.toLocaleString()+"件｜地名を判定しています…";const patterns=PLACES.map(p=>new RegExp(p[4]));for(const p of PLACES)placeGroups.set(p[0],[]);for(let i=0;i<rows.length;i+=60){for(const r of rows.slice(i,i+60)){const text=String(r.title||"")+" "+String(r.descriptionClean||r.descriptionOriginal||r.description||r.summary||"").slice(0,1400);for(let j=0;j<PLACES.length;j++){if(patterns[j].test(text))placeGroups.get(PLACES[j][0]).push(r)}}if(i%600===0){$("#status").textContent="地名判定 "+Math.min(i+60,rows.length)+"/"+rows.length;await wait()}}$("#status").textContent="読み込み完了｜掲載対象 "+rows.length.toLocaleString()+"件";draw()}catch(e){$("#status").textContent="読み込み失敗："+e.message;console.error(e)}}
