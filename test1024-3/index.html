<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朝ポキの宇宙｜TEST 1024.3 軽量版</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#071e2c;color:#e2f2f5}header,main{max-width:1060px;margin:auto;padding:20px}h1{font-size:clamp(24px,5vw,38px);margin:0}p{color:#aacbd3;line-height:1.6}.tag{font-size:12px;letter-spacing:.12em;color:#79cfe4}.tabs,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}button{font:inherit;cursor:pointer;color:#e9fbff;background:#124056;border:1px solid #326d82;border-radius:13px;padding:14px;text-align:left;transition:background .12s}button:hover,button:focus{background:#1e6985;outline:2px solid #71c6dc}button:disabled{opacity:.5}.tabs{display:flex;flex-wrap:wrap;margin:20px 0}.tabs button[aria-pressed=true]{background:#246f87}small{display:block;color:#a8d6df;margin-top:6px}.grid{margin:20px 0 28px}.panel{border:1px solid #29586a;border-radius:16px;padding:18px;background:#0d3042;margin:18px 0}ol{padding-left:22px}li{padding:9px 0;border-bottom:1px solid #32607555;line-height:1.5}a{color:#9ce5fa}#progress{height:8px;background:#21495a;border-radius:6px;overflow:hidden}#bar{height:100%;width:0;background:#61b9d3}#results{max-height:65vh;overflow:auto}#load{margin:20px 0}#stars{min-height:110px}.muted{font-size:13px}</style></head><body><header><div class="tag">OCEANIC / TEST 1024.3</div><h1>朝ポキの宇宙</h1><p>軽量・段階読み込み版。重い星の配置計算とCanvas連続描画を撤去し、クリックできる星の一覧から探索します。</p></header><main><section class="panel" id="load"><strong id="status">ページの準備ができました</strong><div id="progress"><div id="bar"></div></div><p class="muted">データの読み込み中も画面は操作できます。処理は少量ずつ進めます。</p></section><nav class="tabs" aria-label="星の種類"><button data-mode="topic" aria-pressed="true">話題</button><button data-mode="people">出演者</button><button data-mode="roles">肩書</button><button data-mode="org">組織</button></nav><section id="stars" class="grid" aria-label="星の一覧"><p>データを取得しています…</p></section><section class="panel" id="detail" hidden><h2 id="selected"></h2><p>入れ子：関連する話題・出演者を選べます。</p><div id="nested" class="grid"></div><h3 id="episodeTitle">エピソード</h3><ol id="results"></ol></section></main><script>
"use strict";
const BASE="https://neyito96.github.io/asarisunowa/library/data/";
const TOPICS=[["政治","政治|国会|首相|選挙|政党|大臣"],["経済","経済|物価|企業|金融|賃金|投資"],["福祉","福祉|介護|障害|年金|支援"],["教育","教育|学校|大学|教師|高校|子ども"],["医療","医療|病院|医師|治療|患者|薬"],["AI・技術","AI|人工知能|半導体|デジタル|サイバー|IT"],["国際","国際|戦争|中国|アメリカ|ロシア|外交"],["環境","環境|気候|温暖化|災害|エネルギー"],["文化","文化|芸術|映画|音楽|文学|漫画"],["スポーツ","スポーツ|野球|サッカー|五輪|相撲"],["暮らし","暮らし|家族|子育て|生活|住宅|料理"],["地域","地方|地域|自治体|農業|市町村"],["司法","裁判|司法|人権|差別|法律"],["歴史","歴史|戦後|昭和|史料|遺跡"],["科学","科学|研究|宇宙|実験|発見"],["メディア","新聞|報道|メディア|テレビ|ポッドキャスト"],["仕事","仕事|労働|働く|就職|職場"],["ジェンダー","女性|男性|ジェンダー|性別"],["防災","防災|地震|避難|豪雨"],["その他","."]];
const RULES=TOPICS.slice(0,-1).map(([name,re])=>[name,new RegExp(re,"i")]);let rows=[],mode="topic",groups=new Map(),ready=false;
const $=s=>document.querySelector(s);const wait=()=>new Promise(r=>setTimeout(r,0));
const tokens=s=>String(s||"").split(/[、,，;；\n／/]/).map(x=>x.replace(/（[^）]*）|\([^)]*\)/g,"").trim()).filter(x=>x.length>=2&&x.length<28&&!/https?:|@|twitter|\.com/i.test(x));
function classify(r){const t=String(r.title||"");const hits=RULES.filter(([,re])=>re.test(t)).map(([name])=>name);return hits.length?hits:["その他"]}
function kind(name){if(/(?:社|本部|支局|研究所|委員会|協会|センター|編集部|社会部|政治部|経済部)$/.test(name))return "org";if(/(?:記者|編集長|デスク|委員|ディレクター|プロデューサー|司会|部長|編集者)$/.test(name))return "roles";return "people"}
function keys(r,m){if(m==="topic")return classify(r);return [...new Set(tokens(r.cast).filter(x=>kind(x)===m))].slice(0,12)}
function build(){groups=new Map();for(const r of rows){for(const k of keys(r,mode)){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}}render()}
function button(label,count,fn){const b=document.createElement("button");b.type="button";b.textContent=label;const sm=document.createElement("small");sm.textContent=count.toLocaleString()+"件";b.append(sm);b.onclick=fn;return b}
function render(){const root=$("#stars");root.replaceChildren();const max=mode==="topic"?20:120;const sorted=[...groups].sort((a,b)=>b[1].length-a[1].length).slice(0,max);for(const [name,list] of sorted)root.append(button(name,list.length,()=>choose(name,list)));if(!sorted.length)root.textContent="該当データがありません。"}
function episodes(name,list){$("#episodeTitle").textContent=name+"｜"+list.length+"件（先頭80件）";const ol=$("#results");ol.replaceChildren();for(const r of list.slice(0,80)){const li=document.createElement("li"),a=document.createElement("a");a.href="https://neyito96.github.io/asarisunowa/library/?ep="+encodeURIComponent(r.id);a.target="_blank";a.rel="noopener noreferrer";a.textContent=(r.title||r.id)+"（"+(r.show||"")+"）";li.append(a);ol.append(li)}}
function choose(name,list){$("#detail").hidden=false;$("#selected").textContent=name+" の内側";episodes(name,list);const nested=$("#nested");nested.replaceChildren();const m=mode==="topic"?"people":"topic";const sub=new Map();for(const r of list){for(const k of keys(r,m)){if(k===name)continue;if(!sub.has(k))sub.set(k,[]);sub.get(k).push(r)}}for(const [k,v] of [...sub].sort((a,b)=>b[1].length-a[1].length).slice(0,24))nested.append(button(k,v.length,()=>{episodes(k,v);$("#episodeTitle").scrollIntoView({behavior:"smooth",block:"nearest"})}));$("#detail").scrollIntoView({behavior:"smooth",block:"start"})}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("#detail").hidden=true;if(ready)build()});
async function load(){try{const res=await fetch(BASE+"manifest.json");if(!res.ok)throw Error("manifest HTTP "+res.status);const manifest=await res.json();const files=manifest.shows.flatMap(x=>x.search||[]);const all=[];for(let i=0;i<files.length;i++){const r=await fetch(BASE+files[i]);if(!r.ok)throw Error("data HTTP "+r.status);const part=await r.json();all.push(...part);$("#status").textContent="読み込み中 "+(i+1)+"/"+files.length+"ファイル";$("#bar").style.width=(100*(i+1)/files.length)+"%";await wait()}const scopeResponse=await fetch(BASE+"scope.json");if(!scopeResponse.ok)throw Error("掲載範囲を取得できません");const scope=await scopeResponse.json();const module=await import(BASE+"../publication-scope.mjs");rows=module.selectPublishedEpisodes(all,scope,{requireComplete:true});ready=true;$("#status").textContent="読み込み完了｜掲載対象 "+rows.length.toLocaleString()+"件";await wait();build()}catch(err){$("#status").textContent="読み込み失敗："+err.message;console.error(err)}}
load();
</script></body></html>
