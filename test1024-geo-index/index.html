<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朝ポキの地図 | Geo Index Pilot</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui;background:#092535;color:#e9f5f9}main{max-width:1000px;margin:auto;padding:18px}h1{font-size:clamp(24px,5vw,38px)}p{line-height:1.6}#map{height:55vh;min-height:320px;border-radius:12px}a{color:#8ee6ff}article{margin-top:16px;padding:14px;border:1px solid #2e6174;border-radius:12px}small{color:#b7d1dc}button{padding:10px;border-radius:9px}</style></head><body><main><h1>朝ポキの地図 — 地理索引パイロット</h1><p>安全な独立テストページ。全5,848件の地理分類を完了したページではありません。既存MAP2と本番は変更していません。</p><p id="status">索引を取得中…</p><div id="map" aria-label="地図"></div><article><h2>地名とエピソード</h2><div id="items"></div><p><small>「地名への言及」と「取材地・録音地」は異なります。地域の集計はEP-IDの重複を除いて行います。</small></p></article></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
"use strict";const status=document.querySelector("#status"),items=document.querySelector("#items");
(async()=>{try{const r=await fetch("../data/geo-index-pilot-20261024.json");if(!r.ok)throw Error("HTTP "+r.status);const x=await r.json();if(x.schema!=="asarisu-geo-index-v0.1-pilot")throw Error("schema mismatch");const excluded=new Set(x.rejections.map(v=>v.epId+"|"+v.candidatePlace));if(!excluded.has("EP-02795|松本市")||!excluded.has("EP-02239|松本市"))throw Error("回帰テスト失敗：松本誤検出");if(!x.mentions.some(m=>m.epId==="EP-05560"&&m.placeId==="JP-37-Takamatsu"))throw Error("回帰テスト失敗：高松");const map=L.map("map").setView([34.34,134.05],9);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors",maxZoom:14}).addTo(map);for(const loc of x.locations.filter(l=>l.level==="city")){const ms=x.mentions.filter(m=>m.placeId===loc.id);const ids=[...new Set(ms.map(m=>m.epId))];const marker=L.marker([loc.lat,loc.lon]).addTo(map);const b=document.createElement("button");b.textContent=loc.name+"｜"+ids.length+"件";b.onclick=()=>{items.replaceChildren();const h=document.createElement("h3");h.textContent=loc.name;items.append(h);for(const m of ms){const p=document.createElement("p"),a=document.createElement("a");a.href="https://neyito96.github.io/asarisunowa/library/?ep="+encodeURIComponent(m.epId);a.textContent=m.epId+"｜図書館で開く";a.target="_blank";a.rel="noopener noreferrer";p.append(a,document.createTextNode(" — "+m.evidence+"（タイトルで言及）"));items.append(p)}};marker.bindPopup(b)}status.textContent="検証成功：高松EP-05560 / 長野の誤検出2件を除外。索引は試験用1エピソードのみ";}catch(e){status.textContent="読み込みまたは検証に失敗："+e.message;console.error(e)}})();
</script></body></html>
