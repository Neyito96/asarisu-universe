<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朝ポキの宇宙｜主テーマの星雲</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061522;color:#eaf7ff}header,main{max-width:1150px;margin:auto;padding:20px}h1{font-size:clamp(24px,4vw,38px);margin:8px 0}p{color:#b8d4e3;line-height:1.65}.tag{font-size:12px;letter-spacing:.12em;color:#8bc9e4}.panel{background:#102b3e;border:1px solid #32556d;border-radius:16px;padding:16px;margin:12px 0}#sky{width:100%;display:block;background:radial-gradient(ellipse at center,#163850,#061625);border-radius:15px;touch-action:manipulation}#status,#hint{margin:8px 0;font-weight:600}#hint{color:#bce8f5;min-height:25px}#back{display:none;margin:7px 0 13px}button{padding:9px 15px;background:#225b79;border:1px solid #78c7e9;border-radius:9px;color:white;font:inherit;cursor:pointer}a{color:#9fddff}#items{max-height:45vh;overflow:auto;padding-left:26px}li{padding:9px 0;border-bottom:1px solid #345469}li small{color:#aac8d8}.node{cursor:pointer;outline:none}.node:focus-visible circle{stroke:#fff;stroke-width:5}#hint{font-size:15px}svg text{pointer-events:none}.note{font-size:13px;color:#b8d2e4}</style></head><body><header><div class="tag">ASAPOKI UNIVERSE / TWO-LEVEL NEBULA · TEST 1025.2</div><h1>朝ポキの宇宙｜テーマ星雲</h1><p>まず大きな「主テーマ」を選び、その内側で「野球・サッカー・陸上」などの小テーマを探します。10月23日の分類成果をそのまま保存し、表示上の階層だけを整理した試験版です。</p></header><main><section class="panel"><div id="status" role="status">星雲を読み込んでいます…</div><button id="back" type="button">← 主テーマの宇宙へ戻る</button><p id="hint">星をタップして中の小テーマを開いてください。</p><svg id="sky" viewBox="0 0 960 640" role="group" aria-label="テーマ星雲。主テーマから小テーマへ移動します"></svg><p class="note">円の面積は該当エピソード数に比例。視認性のため最小サイズを確保しています。分類は暫定候補で、未整理2,104件は別途保留しています。</p></section><section class="panel"><h2 id="selected">星を選択してください</h2><div id="loadhint"></div><ol id="items"></ol></section><p><a href="../versions/">試験版一覧</a></p></main><script>
"use strict";
const sky=document.querySelector("#sky"),status=document.querySelector("#status"),hint=document.querySelector("#hint"),back=document.querySelector("#back"),selected=document.querySelector("#selected"),items=document.querySelector("#items"),loadhint=document.querySelector("#loadhint");const ns="http://www.w3.org/2000/svg";const colors=["#68b7da","#8bd1bb","#dfb77b","#b9aae9","#ee9db9","#8db8de","#abcc9b","#e8c78d","#a2c7ec","#78c6ba"];let net,full;let active=null;const families=[];function S(tag,attrs={}){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));return el}function clear(){sky.replaceChildren()}function cut(s,n=14){return s.length>n?s.slice(0,n-1)+"…":s}function cluster(items,large){clear();const count=items.length;const columns=large?4:5,rows=Math.ceil(count/columns),dx=960/(columns+0.55),dy=640/(rows+0.3);const max=Math.max(...items.map(x=>x.count));items.forEach((item,i)=>{let col=i%columns,row=Math.floor(i/columns),cx=(col+.77)*dx+(row%2?12:-12),cy=(row+.65)*dy;const radius=large?Math.max(49,Math.min(86,25+Math.sqrt(item.count/max)*62)):Math.max(37,Math.min(75,24+Math.sqrt(item.count/max)*52));const group=S("g",{class:"node",tabindex:"0",role:"button","aria-label":item.name+"、"+item.count+"件"}),circle=S("circle",{cx,cy,r:radius,fill:item.color||colors[i%colors.length],"fill-opacity":".82",stroke:"#d9f3ff","stroke-width":"1.5"}),title=S("title");title.textContent=item.name+"｜"+item.count+"件";circle.append(title);group.append(circle);const label=S("text",{x:cx,y:cy-3,"font-size":large?"16":"13","font-weight":"700","text-anchor":"middle",fill:"#092439"});label.textContent=cut(item.name,large?10:11);group.append(label);const n=S("text",{x:cx,y:cy+20,"font-size":large?"14":"12","text-anchor":"middle",fill:"#092439"});n.textContent=item.count+"件";group.append(n);group.addEventListener("mouseenter",()=>hint.textContent=item.name+"｜"+item.count+"件");group.addEventListener("focus",()=>hint.textContent=item.name+"｜"+item.count+"件");const run=()=>large?openFamily(item.name):openChild(item);group.addEventListener("click",run);group.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();run()}});sky.append(group)})}
function showMain(){active=null;back.style.display="none";selected.textContent="主テーマを選択してください";loadhint.textContent="";items.replaceChildren();hint.textContent="大きな主テーマの星を選ぶと小テーマが現れます。";const main=families.map((name,i)=>({name,count:net.nodes.filter(n=>n.family===name).reduce((v,n)=>v+n.count,0),color:colors[i%colors.length]})).sort((a,b)=>b.count-a.count);status.textContent="主テーマ "+main.length+"領域 ／ 回収分類5,358件";cluster(main,true)}
function openFamily(f){active=f;back.style.display="inline-block";const children=net.nodes.filter(x=>x.family===f).map((x,i)=>({...x,color:colors[families.indexOf(f)%colors.length]})).sort((a,b)=>b.count-a.count);selected.textContent=f+"｜小テーマを選択";items.replaceChildren();loadhint.textContent="";hint.textContent="「"+f+"」の小テーマが"+children.length+"個あります。";status.textContent=f+"｜合計"+children.reduce((n,x)=>n+x.count,0)+"件";cluster(children,false)}
async function openChild(n){selected.textContent=n.family+" → "+n.name+"｜"+n.count+"件";items.replaceChildren();loadhint.textContent="分類原本を読み込んでいます…";try{if(!full){const r=await fetch("../data/semantic-recovery/theme-bridge-pilot.json");if(!r.ok)throw Error("HTTP "+r.status);full=await r.json()}const rows=full.episodes.filter(r=>r[1]===n.family&&r[2]===n.name);const frag=document.createDocumentFragment();for(const row of rows){const li=document.createElement("li"),a=document.createElement("a"),small=document.createElement("small");a.href="https://neyito96.github.io/asarisunowa/library/?ep="+encodeURIComponent(row[0]);a.target="_blank";a.rel="noopener noreferrer";a.textContent=row[0]+"｜"+(row[6]||row[4]);small.textContent="原主題："+row[4]+" ／ 判定："+row[5];li.append(a,document.createElement("br"),small);frag.append(li)}items.append(frag);loadhint.textContent="一覧は元の主題と判定状態を保持しています。";selected.scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){loadhint.textContent="読み込みエラー："+e.message}}
back.addEventListener("click",showMain);
(async()=>{try{const r=await fetch("../data/semantic-recovery/theme-network-lite.json");if(!r.ok)throw Error("HTTP "+r.status);net=await r.json();families.push(...new Set(net.nodes.map(n=>n.family)));showMain()}catch(e){status.textContent="表示エラー："+e.message}})();
