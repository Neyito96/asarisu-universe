<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朝ポキの宇宙｜主・副テーマ試験星雲</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{background:#071724;color:#eaf5ff;margin:0}header,main{max-width:1180px;margin:auto;padding:20px}h1{font-size:clamp(26px,5vw,42px);margin:4px 0}p{line-height:1.6;color:#b9cedd}.tag{font-size:12px;letter-spacing:.12em;color:#84c7e7}.panel{background:#102c40;border:1px solid #355970;border-radius:16px;padding:15px;margin:15px 0}svg{display:block;width:100%;height:auto;background:radial-gradient(ellipse at center,#183b55,#081a2c);border-radius:12px}button{border:1px solid #6493ab;border-radius:9px;background:#174b69;color:white;padding:11px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff}a{color:#9bdeff}#items{max-height:42vh;overflow:auto;padding-left:25px}li{padding:7px 0;border-bottom:1px solid #34556b}circle{cursor:pointer;transition:stroke-width .13s,fill-opacity .13s}circle:hover,circle:focus{stroke-width:4;fill-opacity:1}text{pointer-events:none}#hint{min-height:26px;color:#dbf8ff}#legend{font-size:13px}</style></head><body><header><div class="tag">OCEANIC / SEMANTIC BRIDGE PILOT 2026-10-25</div><h1>朝ポキの宇宙｜意味のある星雲</h1><p>2026年10月23日に保存された分類データ5,358件を回収し、共通カテゴリの候補を作った試験版。元の主題は保持し、星雲の分類は暫定ルールです。</p></header><main><section class="panel"><div id="status" role="status">軽量ネットワークを読込中…</div><p id="hint">丸にマウスを重ねると分類候補と件数が表示されます。タップするとエピソードを読み込みます。</p><svg id="sky" viewBox="0 0 1024 690" role="img" aria-label="主題分類候補の星雲。各円は候補のエピソード数に比例。"></svg><p id="legend">※ 円の面積が候補数に比例します。未整理2,104件は別途審査対象として隠しています。概要精読していない暫定分類を確定扱いにしません。</p></section><section class="panel"><h2 id="selected">星雲を選択してください</h2><div id="loadhint"></div><ol id="items"></ol></section><p><a href="../versions/">試験版一覧に戻る</a></p></main><script>
"use strict";const svg=document.querySelector("#sky"),status=document.querySelector("#status"),hint=document.querySelector("#hint"),selected=document.querySelector("#selected"),items=document.querySelector("#items"),loadhint=document.querySelector("#loadhint");const ns="http://www.w3.org/2000/svg";let full=null;const palette=["#6aa7d3","#82c4b6","#ddbd88","#b7a0db","#dc9aaf","#8fc4dc","#9ac0a6","#b9b7e0","#dac18e","#93c6b6"];function el(tag,attrs={}){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e}async function openNode(n){selected.textContent=n.name+"｜"+n.count+"件";items.replaceChildren();loadhint.textContent="関連エピソードを読み込んでいます…";try{if(!full){const r=await fetch("../data/semantic-recovery/theme-bridge-pilot.json");if(!r.ok)throw Error("HTTP "+r.status);full=await r.json()}const rows=full.episodes.filter(r=>r[1]===n.family&&r[2]===n.name);for(const row of rows){const li=document.createElement("li"),a=document.createElement("a");a.href="https://neyito96.github.io/asarisunowa/library/?ep="+encodeURIComponent(row[0]);a.target="_blank";a.rel="noopener noreferrer";a.textContent=row[0]+"｜"+(row[6]||row[4]);const small=document.createElement("small");small.textContent="原主題："+row[4]+" ／ 状態："+row[5];li.append(a,document.createElement("br"),small);items.append(li)}loadhint.textContent="元の主題と判定状態を保持しています。表示先は図書館です。";selected.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){loadhint.textContent="取得失敗："+e.message}}
(async()=>{try{const r=await fetch("../data/semantic-recovery/theme-network-lite.json");if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();if(d.schema!=="asapoki-universe-theme-lite-v1")throw Error("形式が違います");const nodes=d.nodes.slice().sort((a,b)=>b.count-a.count),family=[...new Set(nodes.map(x=>x.family))];const positions=[];for(let i=0;i<nodes.length;i++){const theta=i*2.399963;const rad=55+Math.sqrt(i/nodes.length)*268;const cx=512+rad*Math.cos(theta)*1.43,cy=335+rad*Math.sin(theta);positions.push([Math.max(37,Math.min(987,cx)),Math.max(38,Math.min(652,cy))])}for(let i=0;i<nodes.length;i++){const n=nodes[i],pos=positions[i],radius=Math.max(10,Math.sqrt(n.count)*1.75),color=palette[family.indexOf(n.family)%palette.length];const g=el("g");const circle=el("circle",{cx:pos[0],cy:pos[1],r:radius,fill:color,"fill-opacity":".77",stroke:"#ecfbff","stroke-width":"1.2",tabindex:"0",role:"button","aria-label":n.family+" "+n.name+" "+n.count+"件"});const title=el("title");title.textContent=n.family+" / "+n.name+"｜"+n.count+"件";circle.append(title);circle.addEventListener("mouseenter",()=>{hint.textContent=n.family+" / "+n.name+" — "+n.count+"件"});circle.addEventListener("focus",()=>{hint.textContent=n.family+" / "+n.name+" — "+n.count+"件"});circle.addEventListener("click",()=>openNode(n));circle.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openNode(n)}});g.append(circle);if(n.count>=60){const lab=el("text",{x:pos[0],y:pos[1]+3,"font-size":"11","text-anchor":"middle",fill:"#062037","font-weight":"700"});lab.textContent=n.name.length>7?n.name.slice(0,7)+"…":n.name;g.append(lab)}svg.append(g)}status.textContent="星雲表示成功："+nodes.length+"小テーマ候補 ／ 回収5,358件 ／ 未整理"+d.unresolved+"件";}catch(e){status.textContent="表示エラー："+e.message}})();
</script></body></html>
